<!DOCTYPE html>
<html>
<head>
    <title>Emails Table</title>
     <!-- For the logo png -->
     <link rel="shortcut icon" size="32x32" type="image/icon" href="static/images/logo.png"/>
    <link rel="stylesheet" href="static/css/styledata.css" />
</head>
<body>
    <img src="static/images/osintech.png" alt="Brand Logo" style="max-width: 170px; height: auto;" />
    <div class="card-container">
        <div class="top-bar">
            <a href="{{ url_for('data') }}" class="back-link">&larr; Back to Data</a>
            <a href="{{ url_for('export_emails') }}" class="export-btn">Export to CSV</a>
        </div>
        <h1 style="color: rgb(64, 66, 66); font-size: 200%;">Emails Table</h1>
        <table>
            <thead>
                <tr>
                    <th style="text-align: center; background-color:rgb(102, 183, 178);">Email Address</th>
                </tr>
            </thead>
            <tbody>
                {% for email in emails %}
                <tr>
                    <td>{{ email }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
