<!DOCTYPE html>
<html>
    <head>
        <title>Domain Table</title>
         <!-- For the logo png -->
         <link rel="shortcut icon" size="32x32" type="image/icon" href="static/images/logo.png"/>
         <link rel="stylesheet" href="static/css/styledomains.css" />
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
<body>
    <img src="static/images/osintech.png" alt="Brand Logo" style="max-width: 170px; height: auto;" />
    <div class="card-container">
        <div class="top-bar">
            <a href="{{ url_for('data') }}" class="back-link">&larr; Back to Data</a>
            <a href="{{ url_for('export_domains') }}" class="export-btn"><i class="fas fa-file-csv"></i>Export to CSV</a>
        </div>
        <h1>Domains & subdomains Table</h1>
        <p style="text-align: left; font-size: 1.2em; color: #2878e0;">
            Found {{ domains_count }} {{ "result" if domains_count == 1 else "results" }}
        </p>
        <table>
            <thead>
                <tr>
                    <th style="text-align: center;">Domain / Subdomain Name</th>
                </tr>
            </thead>
            <tbody>
                {% for domain in domains %}
                <tr>
                    <td>{{ domain }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div id="scroll-Top">
				<div class="return-to-top">
					<i class="fa fa-angle-up " id="scroll-top" ></i>
				</div>
				
	</div><!--/.scroll-Top-->
 <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="static/js/custom.js"></script>
</body>
</html>
